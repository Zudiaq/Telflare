<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Telflare — ZUD Cloud</title>
    
    <!-- Viewport & Mobile Safe Area Configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Color Scheme & Samsung Internet / Chromium Auto Dark Protection -->
    <meta name="color-scheme" content="only dark" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="nightmode" content="disable" />

    <!-- Early PWA Install Prompt Capture -->
    <script>
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
      });
    </script>

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Theme & Brand Colors -->
    <meta name="theme-color" content="#131314" />
    <meta name="msapplication-TileColor" content="#131314" />
    <meta name="msapplication-navbutton-color" content="#131314" />
    
    <!-- Standard Favicons -->
    <link rel="icon" type="image/png" href="/cloud.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/cloud.svg" />
    <link rel="shortcut icon" href="/cloud.png?v=3" />
    
    <!-- Apple iOS Safari Web App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telflare" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    
    <!-- Android / General Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Telflare" />
    
    <!-- Preloads & Non-Blocking Fonts (prevents render stalls on restricted networks) -->
    <link rel="preload" href="/cloud.svg" as="image" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body class="bg-[#131314] text-white overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
